# Validates the package on every PR; on main, publishes this repository as a
# pkg registry on GitHub Pages (https://bjorand.github.io/realm/), with the
# mkindex tool of termina-packages.
name: registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: Lua 5.4 (syntax check)
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Published index (to require a new version when the package changes)
        run: curl -fsSL https://bjorand.github.io/realm/index.lua -o prev.lua || rm -f prev.lua
      - name: Validate and generate the site
        run: |
          PREV=""
          if [ -f prev.lua ]; then PREV="-prev prev.lua"; fi
          go run github.com/bjorand/termina-packages/tools/mkindex@main \
            -packages packages -luac luac5.4 \
            -repo "${{ github.server_url }}/${{ github.repository }}" -out site $PREV
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
